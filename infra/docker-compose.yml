services:
  postgres:
    image: postgres:16
    container_name: scheduler_postgres
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - "5432:5432"
    volumes:
      - scheduler_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./supabase:/schema:ro
      - ./sql:/schema_extra:ro
    environment:
      PGPASSWORD: scheduler
    entrypoint:
      - /bin/sh
      - -lc
      - |
          set -euo pipefail
          echo "=== MIGRATE START ==="
          echo "Listing /schema:"
          ls -lah /schema
          echo "Waiting for Postgres..."
          until pg_isready -h postgres -U scheduler -d scheduler; do sleep 1; done
          echo "Applying schema..."
          psql -h postgres -U scheduler -d scheduler -v ON_ERROR_STOP=1 -f /schema/schema.sql
          psql -h postgres -U scheduler -d scheduler -v ON_ERROR_STOP=1 -f /schema_extra/00_orgs_schema.sql
          psql -h postgres -U scheduler -d scheduler -v ON_ERROR_STOP=1 -f /schema_extra/01_enable_rls.sql
          psql -h postgres -U scheduler -d scheduler -v ON_ERROR_STOP=1 -f /schema_extra/02_app_role.sql
          echo "=== MIGRATE DONE ==="


  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: scheduler_api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://app_user:app_user@postgres:5432/scheduler
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: scheduler_web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  scheduler_pgdata:
