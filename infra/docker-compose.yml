version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: scheduler_postgres
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - "5432:5432"
    volumes:
      - scheduler_pgdata:/var/lib/postgresql/data
      # Mount your schema.sql into the container so we can apply it with psql
      - ./supabase:/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  scheduler_pgdata:
