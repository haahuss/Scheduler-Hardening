name: Security Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency_review:
    name: Dependency Review (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ "python", "javascript-typescript" ]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      # For Python + JS/TS, autobuild is usually unnecessary; skipping avoids monorepo build issues.
      - uses: github/codeql-action/analyze@v3

  deps_audit:
    name: Deps audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python deps audit (pip-audit)
        working-directory: apps/api
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -U pip pip-audit
            pip-audit -r requirements.txt
          else
            echo "apps/api/requirements.txt not found — skipping pip-audit"
          fi

      - name: Node deps audit (npm audit)
        working-directory: apps/web
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm audit --audit-level=high
          else
            echo "apps/web/package.json not found — skipping npm audit"
          fi

  container_scan:
    name: Container scan (Trivy) — fail on HIGH/CRITICAL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: |
          if [ -f apps/api/Dockerfile ]; then
            docker build -t scheduler-api:ci -f apps/api/Dockerfile apps/api
          else
            echo "apps/api/Dockerfile not found — skipping container build"
            exit 0
          fi

      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "scheduler-api:ci"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
