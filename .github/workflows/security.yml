name: Security Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # standard for this action :contentReference[oaicite:1]{index=1}

  dependency_review:
    name: Dependency Review (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql_python:
    name: SAST (CodeQL) — Python
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/api/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          source-root: apps/api
      - uses: github/codeql-action/analyze@v3
        with:
          upload: false  # avoids failures on private repos without GHAS :contentReference[oaicite:2]{index=2}

  codeql_js:
    name: SAST (CodeQL) — JS/TS
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/web/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          source-root: apps/web
      - uses: github/codeql-action/analyze@v3
        with:
          upload: false  # flip to true after enabling GH Code Security :contentReference[oaicite:3]{index=3}

  deps_audit:
    name: Deps audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python deps audit (pip-audit)
        if: ${{ hashFiles('apps/api/requirements.txt') != '' }}
        working-directory: apps/api
        run: |
          python -m pip install -U pip pip-audit
          pip-audit -r requirements.txt

      - name: Node deps audit (npm audit)
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        working-directory: apps/web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm audit --audit-level=high

  container_scan:
    name: Container scan (Trivy) — fail on HIGH/CRITICAL
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/api/Dockerfile') != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t scheduler-api:ci -f apps/api/Dockerfile apps/api

      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "scheduler-api:ci"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
