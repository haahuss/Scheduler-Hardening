name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read



jobs:
  api:
    name: API — lint & tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
          POSTGRES_DB: scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U scheduler -d scheduler"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20


    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            apps/api/requirements*.txt
            apps/api/pyproject.toml
            apps/api/poetry.lock

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          ruff check .

      - name: Format check (ruff)
        run: |
          python -m pip install ruff
          ruff format --check .

      - name: Apply schema
        working-directory: .
        run: |
          until pg_isready -h localhost -U scheduler -d scheduler; do sleep 1; done
          PGPASSWORD=scheduler psql -h localhost -U scheduler -d scheduler -v ON_ERROR_STOP=1 -f infra/supabase/schema.sql

      # - name: Run tests (pytest)
      #   run: |
      #     python -m pip install pytest
      #     pytest -q || code=$?
      #     # pytest exit code 5 = "no tests collected" → treat as pass for now
      #     if [ "${code:-0}" = "5" ]; then exit 0; fi
      #     exit "${code:-0}"
      - name: Run tests (pytest)
        env:
          DATABASE_URL: postgresql+asyncpg://scheduler:scheduler@localhost:5432/scheduler
          PYTHONPATH: ${{ github.workspace }}/apps/api
        run: |
          python -m pytest -q


  web:
    name: Web — lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present
